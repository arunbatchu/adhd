<!DOCTYPE html><html><head><meta charset="utf-8">
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<style>
 html,body{margin:0;padding:0;background:transparent;}
 #net{width:1731px;height:909px;background:transparent;}
</style></head><body>
<div id="net"></div>
<script>
fetch('graph.json').then(r=>r.json()).then(g=>{
  const groups={};
  for(const [k,v] of Object.entries(g.groups)) groups[k]={color:{background:v.color,border:v.color},borderWidth:0};
  const nodes=g.nodes.map(n=>{
    const c=Math.log((n.cis||1)+1);
    return {id:n.id, group:n.group, shape:'dot',
            size: 5 + 9*Math.min(1,c/Math.log(1870)) + (n.cis>200?14:0),
            color:{background:(g.groups[n.group]||{}).color||'#888',
                   border:(g.groups[n.group]||{}).color||'#888'},
            borderWidth:0};
  });
  const edges=g.edges.map(e=>({from:e.from,to:e.to,
      color:{color:'rgba(96,110,130,0.62)'},width:1.0,smooth:{type:'continuous'}}));
  const net=new vis.Network(document.getElementById('net'),
    {nodes:new vis.DataSet(nodes),edges:new vis.DataSet(edges)},
    {groups, interaction:{dragNodes:false},
     physics:{stabilization:{iterations:900},barnesHut:{gravitationalConstant:-9000,springLength:130,springConstant:0.035,avoidOverlap:0.35}},
     nodes:{shadow:{enabled:true,size:8,x:0,y:2,color:'rgba(0,0,0,0.18)'}},
     edges:{arrows:{to:{enabled:false}}}});
  net.on('stabilizationIterationsDone',()=>{net.setOptions({physics:false});net.fit({animation:false});window.__ready=true;});
});
</script></body></html>
