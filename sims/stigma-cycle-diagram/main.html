<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>The Stigma Cycle</title>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/vis-network/styles/vis-network.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="network"></div>

        <div class="title">The Stigma Cycle</div>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-color color-loop"></div>
                <span><strong>Loop stage</strong> - click to inspect</span>
            </div>
            <div class="legend-item">
                <div class="legend-color color-break"></div>
                <span><strong>Break point</strong> - click to cut the loop</span>
            </div>
        </div>

        <div class="right-panel">
            <div class="status-info" id="status-info">
                <div class="status-title" id="status-title">A reinforcing loop</div>
                <div class="status-text" id="status-text">
                    Each stage feeds the next, around and around. Click any red
                    stage to see it up close - or click a green break point to
                    cut the loop and watch what changes downstream.
                </div>
            </div>
            <div class="controls">
                <button class="btn btn-secondary" id="reset-btn">Restore the loop</button>
            </div>
        </div>
    </div>

    <script src="stigma-cycle-diagram.js"></script>
</body>
</html>
