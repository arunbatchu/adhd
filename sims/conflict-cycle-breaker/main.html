<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="light">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>The Conflict Cycle Breaker</title>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/vis-network/styles/vis-network.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="network"></div>

        <div class="title">The Conflict Cycle Breaker</div>

        <div class="legend">
            <div class="legend-item"><div class="legend-color color-loop"></div><span><strong>Loop stage</strong></span></div>
            <div class="legend-item"><div class="legend-color color-break"></div><span><strong>Exit</strong> - click to cut</span></div>
            <div class="legend-item"><span class="who who-family">family</span><span class="who who-person">person</span><span class="who who-either">either</span></div>
        </div>

        <div class="right-panel">
            <div class="controls">
                <button class="btn btn-primary" id="turn-btn">Run one turn</button>
                <button class="btn btn-secondary" id="reset-btn">Reset</button>
            </div>
            <div class="status-info">
                <div class="status-title" id="status-title">A loop either person can cut</div>
                <div class="status-text" id="status-text">
                    Click any red stage for its anatomy and who can act there.
                    Click a green exit to cut the loop and see the replacement
                    sentence. Or run one turn and watch it spin.
                </div>
            </div>
        </div>
    </div>

    <script src="conflict-cycle-breaker.js"></script>
</body>
</html>
