<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="light">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Titration Response Tracker MicroSim</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, Helvetica, sans-serif; background: aliceblue; }
        .wrap { padding: 8px 12px; }
        h1 { font-size: 18px; text-align: center; margin: 2px 0 6px 0; }
        #chart-container { position: relative; height: 300px; width: 100%; background: white; border: 1px solid silver; border-radius: 6px; padding: 6px; }
        .decision { margin-top: 8px; background: white; border: 1px solid silver; border-radius: 6px; padding: 8px 10px; min-height: 118px; }
        .decision .q { font-size: 13px; font-weight: bold; margin-bottom: 6px; }
        .decision .fb { font-size: 12px; line-height: 1.45; margin-top: 6px; }
        .btn-row { display: flex; flex-wrap: wrap; gap: 6px; }
        button { padding: 6px 10px; font-size: 12px; border: 1px solid #999; border-radius: 5px; background: #eef2f7; cursor: pointer; }
        button:hover { background: #dbe4ef; }
        button.picked { background: #2196f3; color: white; }
        .good { color: seagreen; }
        .bad { color: firebrick; }
        a.back { font-size: 12px; }
    </style>
</head>
<body>
    <main>
        <div class="wrap">
            <h1>Titration Response Tracker: Dev's Eight Weeks</h1>
            <div id="chart-container"><canvas id="chart"></canvas></div>
            <div class="decision">
                <div class="q" id="q">Hover the chart to read Dev's weekly diary. Then play prescriber: at weeks 3, 5, and 7, what's the right call?</div>
                <div class="btn-row" id="buttons"></div>
                <div class="fb" id="fb"></div>
            </div>
        </div>
    </main>
    <a class="back" href=".">Back to Documentation</a>
    <script src="titration-response-tracker.js"></script>
</body>
</html>
